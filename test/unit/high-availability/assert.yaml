apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-api-server
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-frontend
spec:
  replicas: 3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dependency-track-storage
spec:
  storageClassName: nfs
  accessModes:
  - ReadWriteMany
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dependency-track-api-server
  namespace: dependency-track
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dependency-track-frontend
  namespace: dependency-track
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
