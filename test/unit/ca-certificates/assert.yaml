apiVersion: v1
kind: Secret
metadata:
  name: dependency-track-ca-certs
  namespace: dependency-track
  annotations:
    kapp.k14s.io/versioned: ""
stringData:
  (starts_with("ca.crt", '-----BEGIN CERTIFICATE-----')): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-api-server
spec:
  template:
    spec:
      (volumes[?name == 'ca-certs'] | [0].secret.secretName): dependency-track-ca-certs
      (initContainers[?name == 'import-ca-certificates'] | [0]):
        image: docker.io/dependencytrack/apiserver
        securityContext:
          readOnlyRootFilesystem: true
      (containers[?name == 'dependency-track-api-server'] | [0]):
        (volumeMounts[?name == 'truststore'] | [0].mountPath): /opt/java/openjdk/lib/security/cacerts
