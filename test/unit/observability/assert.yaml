apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-api-server
spec:
  template:
    metadata:
      (annotations."prometheus.io/scrape" == null): true
    spec:
      (containers[?name == 'dependency-track-api-server'] | [0]):
        (env[?name == 'EXTRA_JAVA_OPTIONS'] | [0].value): -Dlogback.configurationFile=logback-json.xml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dependency-track-app-config
data:
  (contains("application.properties", 'dt.logging.level."org.dependencytrack"=DEBUG')): true
  (contains("application.properties", 'dt.metrics.enabled=false')): true
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-dependency-track
spec:
  (inheritedMetadata == null): true
