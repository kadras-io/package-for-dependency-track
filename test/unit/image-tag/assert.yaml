apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-api-server
spec:
  template:
    spec:
      (containers[?name == 'dependency-track-api-server'] | [0].image): docker.io/dependencytrack/apiserver:5.2.2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-frontend
spec:
  template:
    spec:
      (containers[?name == 'dependency-track-frontend'] | [0].image): docker.io/dependencytrack/frontend:5.2.2
