apiVersion: v1
kind: Namespace
metadata:
  name: sbom
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dependency-track-app-config
  namespace: sbom
data:
  (contains("application.properties", 'postgresql-dependency-track-rw.sbom.svc.cluster.local')): true
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-dependency-track
  namespace: sbom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-api-server
  namespace: sbom
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dependency-track
  namespace: sbom
