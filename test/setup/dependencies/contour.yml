---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  name: contour
  namespace: tests
  annotations:
    kapp.k14s.io/change-group: contour
    kapp.k14s.io/change-rule.cert-manager: upsert after upserting cert-manager
    kapp.k14s.io/change-rule.serviceaccount: delete before deleting serviceaccount
spec:
  serviceAccountName: kadras-install-sa
  packageRef:
    refName: contour.packages.kadras.io
    versionSelection:
      constraints: 1.33.7
  values:
    - secretRef:
        name: contour-values

---
apiVersion: v1
kind: Secret
metadata:
  name: contour-values
  namespace: tests
stringData:
  values.yaml: |
    #! The kind preset: Envoy listens on the host ports of the worker node, which kind maps to the machine.
    #! See: https://github.com/kadras-io/package-for-contour/blob/main/docs/local.md
    contour:
      replicas: 1
    envoy:
      kind: DaemonSet
      host_ports:
        enabled: true
      service:
        type: ClusterIP
