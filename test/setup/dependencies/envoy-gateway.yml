---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  name: envoy-gateway
  namespace: tests
  annotations:
    kapp.k14s.io/change-group: envoy-gateway
    kapp.k14s.io/change-rule.cert-manager: upsert after upserting cert-manager
    kapp.k14s.io/change-rule.serviceaccount: delete before deleting serviceaccount
spec:
  serviceAccountName: kadras-install-sa
  packageRef:
    refName: envoy-gateway.packages.kadras.io
    versionSelection:
      constraints: 1.9.3
  values:
    - secretRef:
        name: envoy-gateway-values

---
# The external Gateway serves Dependency Track over HTTPS, via the `*.127.0.0.1.sslip.io` listener.
apiVersion: v1
kind: Secret
metadata:
  name: envoy-gateway-values
  namespace: tests
stringData:
  values.yaml: |
    gateways:
      external:
        domain: 127.0.0.1.sslip.io
        tls:
          issuer: kadras-ca-issuer
    envoy:
      service:
        type: ClusterIP
