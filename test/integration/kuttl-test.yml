apiVersion: kuttl.dev/v1beta1
kind: TestSuite
testDirs:
- ./test/integration
manifestDirs:
- ./test/setup/assets
parallel: 1
startKIND: true
kindContext: integration
kindNodeCache: true
# The API Server runs the database migrations and seeds the default objects
# the first time it starts, which takes a while.
timeout: 600
artifactsDir: /tmp/kuttl-artifacts
commands:
  - script: |
      kapp deploy -a kapp-controller -y \
        -f https://github.com/carvel-dev/kapp-controller/releases/latest/download/release.yml
  - script: |
      kubectl config set-context --current --namespace=tests && \
      kapp deploy -a secretgen-controller-package -y \
        -f https://github.com/kadras-io/package-for-secretgen-controller/releases/download/v0.21.4/package.yml \
        -f https://github.com/kadras-io/package-for-secretgen-controller/releases/download/v0.21.4/metadata.yml
  - script: |
      kubectl config set-context --current --namespace=tests && \
      kapp deploy -a cert-manager-package -y \
        -f https://github.com/kadras-io/package-for-cert-manager/releases/download/v1.21.3/package.yml \
        -f https://github.com/kadras-io/package-for-cert-manager/releases/download/v1.21.3/metadata.yml
  - script: |
      kubectl config set-context --current --namespace=tests && \
      kapp deploy -a envoy-gateway-package -y \
        -f https://github.com/kadras-io/package-for-envoy-gateway/releases/download/v1.9.3/package.yml \
        -f https://github.com/kadras-io/package-for-envoy-gateway/releases/download/v1.9.3/metadata.yml
  - script: |
      kubectl config set-context --current --namespace=tests && \
      kapp deploy -a postgresql-operator-package -y \
        -f https://github.com/kadras-io/package-for-postgresql-operator/releases/download/v1.30.0/package.yml \
        -f https://github.com/kadras-io/package-for-postgresql-operator/releases/download/v1.30.0/metadata.yml
  - script: |
      kubectl config set-context --current --namespace=tests && \
      kapp deploy -a dependencies -y -f ./test/setup/dependencies
