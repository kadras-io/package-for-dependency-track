# PostgreSQL
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-dependency-track
  namespace: dependency-track
status:
  readyInstances: 1
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-dependency-track-app
  namespace: dependency-track
type: kubernetes.io/basic-auth

# Key Encryption Key
---
apiVersion: v1
kind: Secret
metadata:
  name: dependency-track-kek
  namespace: dependency-track
type: Opaque

# API Server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-api-server
  namespace: dependency-track
spec:
  replicas: 1
status:
  readyReplicas: 1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dependency-track-storage
  namespace: dependency-track
status:
  phase: Bound

# Frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-frontend
  namespace: dependency-track
spec:
  replicas: 1
status:
  readyReplicas: 1

# Image Pull Secret
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: dependency-track
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: dependency-track
spec:
  template:
    spec:
      imagePullSecrets:
        - name: canonical-registry-credentials
