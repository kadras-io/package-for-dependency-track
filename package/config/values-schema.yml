#@data/values-schema
---

#@schema/desc "PEM-encoded certificate data to trust TLS connections with a custom CA. It's imported into the Java truststore used by the API Server."
ca_cert_data: ""

#@schema/desc "Settings for the Dependency Track container images."
image:
  #@schema/desc "The tag to use for the API Server and Frontend container images, overriding the Dependency Track version bundled with this package. The images must be available in a container registry reachable from the cluster, since they are not part of the package bundle."
  #@schema/examples ("Deploy a newer patch release", "5.0.5")
  tag: ""

#@schema/desc "Domain name for Dependency Track. It must be a valid DNS name."
#@schema/validation min_len=4
domain_name: ""

#@schema/desc "A reference to the ClusterIssuer to use for enabling TLS in Dependency Track."
#@schema/examples ("Kadras private CA", "kadras-ca-issuer")
#@schema/validation min_len=4
ingress_issuer: ""

#@schema/desc "Settings for the API Server component."
api_server:
  #@schema/desc "The number of API Server replicas. Values greater than 1 require a storage class supporting the `ReadWriteMany` access mode."
  #@schema/validation min=1
  replicas: 1
  #@schema/desc "Settings for logging."
  logging:
    #@schema/desc "Log verbosity level. Options: `trace`, `debug`, `info`, `warn`, `error`."
    #@schema/validation one_of=["trace", "debug", "info", "warn", "error"]
    level: info
    #@schema/desc "Log encoding format. Options: `console`, `json`."
    #@schema/validation one_of=["console", "json"]
    format: console
  #@schema/desc "Settings for metrics."
  metrics:
    #@schema/desc "Whether to enable the generation of Prometheus metrics."
    enabled: true
  #@schema/desc "Resource configuration for the API Server component."
  resources:
    requests:
      #@schema/desc "CPU requests configuration for the API Server component."
      cpu: "0.5"
      #@schema/desc "Memory requests configuration for the API Server component."
      memory: "5Gi"
    limits:
      #@schema/desc "CPU limits configuration for the API Server component."
      cpu: "4"
      #@schema/desc "Memory limits configuration for the API Server component."
      memory: "5Gi"
  #@schema/desc "Storage configuration for the file storage used by the API Server component."
  storage:
    #@schema/desc "Class name for the PersistenceVolume to create."
    class_name: ""
    #@schema/desc "Size of the PersistenceVolume to create."
    size: 1Gi
    #@schema/desc "Access modes for the PersistenceVolume to create. `ReadWriteMany` is required when running more than one API Server replica."
    #@schema/default ["ReadWriteOnce"]
    access_modes:
    - ""
  #@schema/desc "Additional configuration properties for the API Server, appended to the `application.properties` file and taking precedence over the ones managed by this package. See https://dependencytrack.github.io/docs/next/reference/configuration/properties for the full list."
  #@schema/examples ("Tune the durable execution engine", {"dt.dex-engine.activity-worker.vuln-analysis.max-concurrency": 20})
  #@schema/type any=True
  config: {}

#@schema/desc "Settings for the Frontend component."
frontend:
  #@schema/desc "The number of Frontend replicas. In order to enable high availability, it should be greater than 1."
  #@schema/validation min=1
  replicas: 1
  #@schema/desc "Configuration for the Frontend, provided as environment variables. Use it to enable OpenID Connect, or to point the Frontend at an API Server served from a different host via `API_BASE_URL`. See https://dependencytrack.github.io/docs/next/guides/administration/configuring-oidc for the OpenID Connect settings."
  #@schema/examples ("Enable OpenID Connect", {"OIDC_ISSUER": "https://idp.kadras.io", "OIDC_CLIENT_ID": "dependency-track", "OIDC_SCOPE": "openid profile email"})
  #@schema/type any=True
  config: {}
  #@schema/desc "Resource configuration for the Frontend component."
  resources:
    requests:
      #@schema/desc "CPU requests configuration for the Frontend component."
      cpu: "150m"
      #@schema/desc "Memory requests configuration for the Frontend component."
      memory: "64Mi"
    limits:
      #@schema/desc "CPU limits configuration for the Frontend component."
      cpu: "500m"
      #@schema/desc "Memory limits configuration for the Frontend component."
      memory: "128Mi"

#@schema/desc "Settings for the corporate proxy used by the API Server when calling external services."
proxy:
  #@schema/desc "The HTTPS proxy to use for network traffic. It must be a plain HTTP URL in the form `http://[user[:password]@]host[:port]`."
  https_proxy: ""
  #@schema/desc "The HTTP proxy to use for network traffic. Used only when `https_proxy` is not configured. It must be a plain HTTP URL in the form `http://[user[:password]@]host[:port]`."
  http_proxy: ""
  #@schema/desc "A comma-separated list of hostnames or IP addresses, optionally with a port, that should not use the proxy. An entry matches the host exactly or any of its subdomains. CIDR ranges and leading-dot notation are not supported."
  #@schema/examples ("Skip the proxy for in-cluster traffic", "postgresql-dependency-track-rw,localhost")
  no_proxy: ""

#@schema/desc "Settings for the PostgreSQL database."
postgresql:
  #@schema/desc "Number of instances for the PostgreSQL database cluster. Define at least 3 for production scenarios."
  #@schema/validation min=1
  instances: 1
  #@schema/desc "Settings for metrics."
  metrics:
    #@schema/desc "Whether to enable the generation of Prometheus metrics."
    enabled: true
  #@schema/desc "Storage configuration for each PostgreSQL instance."
  storage:
    #@schema/desc "Size of the PersistenceVolume to create for each PostgreSQL instance."
    size: 1Gi
  #@schema/desc "Configuration parameters for the PostgreSQL server, merged on top of the ones recommended by Dependency Track (`jit=off` and `wal_compression=zstd`). Remember that `max_connections` must cover the sum of the connection pools of all the API Server replicas, plus headroom for migrations, backups, and administrator sessions."
  #@schema/examples ("Tune a production database", {"max_connections": 200, "shared_buffers": "2GB", "effective_cache_size": "6GB"})
  #@schema/type any=True
  parameters: {}
