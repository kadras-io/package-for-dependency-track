#@ load("/lib/validation.star", "access_modes", "is_dns_label", "is_dns_subdomain", "is_flat_map", "is_proxy_url")

#@ def domain_name_set(values):
#@   return not values["ingress"]["enabled"] or values["domain_name"] != ""
#@ end

#@ def shared_storage(values):
#@   return values["api_server"]["replicas"] == 1 or "ReadWriteMany" in list(values["api_server"]["storage"]["access_modes"])
#@ end

#@data/values-schema
#@schema/validation ("`domain_name` to be set when `ingress.enabled` is true", domain_name_set), ("`api_server.storage.access_modes` to include `ReadWriteMany` when `api_server.replicas` is greater than 1, since all the replicas mount the same volume", shared_storage)
---

#! =============================================
#! Deployment
#! =============================================

#@schema/desc "The namespace where to install Dependency Track."
#@schema/validation ("a valid DNS label", is_dns_label)
namespace: dependency-track

#@schema/desc "The domain name where Dependency Track is served. Both the Frontend and the API Server (under `/api`) are served from it."
#@schema/examples ("Kadras domain", "dependency-track.kadras.io")
#@schema/validation ("a valid DNS name", lambda v: v == "" or is_dns_subdomain(v))
domain_name: ""

#@schema/desc "Settings for the Ingress exposing Dependency Track."
ingress:
  #@schema/desc "Whether to expose Dependency Track via an Ingress. When disabled, expose the `dependency-track-frontend` and `dependency-track-api-server` Services yourself."
  enabled: true
  #@schema/desc "The IngressClass to use for the Ingress."
  #@schema/validation min_len=1
  class_name: contour
  #@schema/desc "The cert-manager ClusterIssuer that issues the TLS certificate for the Ingress. When empty, the Secret named `ingress.tls_secret_name` must be provided."
  #@schema/examples ("Kadras private CA", "kadras-ca-issuer")
  issuer: ""
  #@schema/desc "The name of the Secret holding the TLS certificate for the Ingress."
  #@schema/validation ("a valid DNS name", is_dns_subdomain)
  tls_secret_name: dependency-track-tls-secret

#@schema/desc "Settings for the Dependency Track container images."
image:
  #@schema/desc "The tag to use for the API Server and Frontend container images, overriding the Dependency Track version bundled with this package. The images must be available in a container registry reachable from the cluster, since they are not part of the package bundle."
  #@schema/examples ("Deploy a newer patch release", "5.2.2")
  tag: ""

#! =============================================
#! Components
#! =============================================

#@schema/desc "Settings for the API Server component."
api_server:
  #@schema/desc "The number of API Server replicas. Values greater than 1 require the `ReadWriteMany` access mode for the storage."
  #@schema/validation min=1
  replicas: 1
  #@schema/desc "Compute resources for the API Server."
  resources:
    #@schema/desc "The minimum resources reserved for the API Server."
    requests:
      #@schema/desc "The CPU requested by the API Server."
      cpu: "0.5"
      #@schema/desc "The memory requested by the API Server."
      memory: "5Gi"
    #@schema/desc "The maximum resources the API Server can use."
    limits:
      #@schema/desc "The CPU limit for the API Server."
      cpu: "4"
      #@schema/desc "The memory limit for the API Server."
      memory: "5Gi"
  #@schema/desc "Settings for the PersistentVolume holding the API Server file storage, where uploaded BOMs and other artifacts are stored."
  storage:
    #@schema/desc "The StorageClass for the PersistentVolume. When empty, the default StorageClass is used."
    class_name: ""
    #@schema/desc "The size of the PersistentVolume."
    #@schema/validation min_len=1
    size: 1Gi
    #@schema/desc "The access modes for the PersistentVolume. `ReadWriteMany` is required when running more than one API Server replica."
    #@schema/validation min_len=1
    #@schema/default ["ReadWriteOnce"]
    access_modes:
    #@schema/validation one_of=access_modes
    - ReadWriteOnce
  #@schema/desc "Additional configuration properties for the API Server, appended to the `application.properties` file and taking precedence over the ones managed by this package. See https://dependencytrack.github.io/docs/next/reference/configuration/properties for the full list."
  #@schema/examples ("Tune the durable execution engine", {"dt.dex-engine.activity-worker.vuln-analysis.max-concurrency": 20})
  #@schema/type any=True
  #@schema/validation ("a map of strings, numbers or booleans", is_flat_map)
  config: {}

#@schema/desc "Settings for the Frontend component."
frontend:
  #@schema/desc "The number of Frontend replicas. Set it greater than 1 for high availability."
  #@schema/validation min=1
  replicas: 1
  #@schema/desc "Compute resources for the Frontend."
  resources:
    #@schema/desc "The minimum resources reserved for the Frontend."
    requests:
      #@schema/desc "The CPU requested by the Frontend."
      cpu: "150m"
      #@schema/desc "The memory requested by the Frontend."
      memory: "64Mi"
    #@schema/desc "The maximum resources the Frontend can use."
    limits:
      #@schema/desc "The CPU limit for the Frontend."
      cpu: "500m"
      #@schema/desc "The memory limit for the Frontend."
      memory: "128Mi"
  #@schema/desc "Configuration for the Frontend, provided as environment variables. Use it to enable OpenID Connect, or to point the Frontend at an API Server served from a different host via `API_BASE_URL`. See https://dependencytrack.github.io/docs/next/guides/administration/configuring-oidc for the OpenID Connect settings."
  #@schema/examples ("Enable OpenID Connect", {"OIDC_ISSUER": "https://idp.kadras.io", "OIDC_CLIENT_ID": "dependency-track", "OIDC_SCOPE": "openid profile email"})
  #@schema/type any=True
  #@schema/validation ("a map of strings, numbers or booleans", is_flat_map)
  config: {}

#@schema/desc "Settings for the PostgreSQL database, run by the CloudNativePG operator."
postgresql:
  #@schema/desc "The number of PostgreSQL instances: one primary and its replicas. Use at least 3 in production."
  #@schema/validation min=1
  instances: 1
  #@schema/desc "Compute resources for each PostgreSQL instance. The empty ones are not set."
  resources:
    #@schema/desc "The minimum resources reserved for each PostgreSQL instance."
    requests:
      #@schema/desc "The CPU requested by each PostgreSQL instance."
      #@schema/examples ("Two cores", "2")
      cpu: ""
      #@schema/desc "The memory requested by each PostgreSQL instance."
      #@schema/examples ("Eight gibibytes", "8Gi")
      memory: ""
    #@schema/desc "The maximum resources each PostgreSQL instance can use."
    limits:
      #@schema/desc "The CPU limit for each PostgreSQL instance."
      cpu: ""
      #@schema/desc "The memory limit for each PostgreSQL instance."
      memory: ""
  #@schema/desc "Settings for the PersistentVolume of each PostgreSQL instance."
  storage:
    #@schema/desc "The StorageClass for the PersistentVolumes. When empty, the default StorageClass is used."
    class_name: ""
    #@schema/desc "The size of the PersistentVolume of each PostgreSQL instance."
    #@schema/validation min_len=1
    size: 1Gi
  #@schema/desc "Configuration parameters for the PostgreSQL server, merged on top of the ones recommended by Dependency Track (`jit=off` and `wal_compression=zstd`). Remember that `max_connections` must cover the sum of the connection pools of all the API Server replicas, plus headroom for migrations, backups, and administrator sessions."
  #@schema/examples ("Tune a production database", {"max_connections": 200, "shared_buffers": "2GB", "effective_cache_size": "6GB"})
  #@schema/type any=True
  #@schema/validation ("a map of strings, numbers or booleans", is_flat_map)
  parameters: {}

#! =============================================
#! Trust
#! =============================================

#@schema/desc "PEM-encoded certificates of the CAs to trust in TLS connections, in addition to the public ones. They're imported into the Java truststore used by the API Server."
ca_cert_data: ""

#! =============================================
#! Observability
#! =============================================

#@schema/desc "Settings for logs and metrics."
observability:
  #@schema/desc "Settings for the API Server logs."
  logging:
    #@schema/desc "The log verbosity level: `trace`, `debug`, `info`, `warn`, or `error`."
    #@schema/validation one_of=["trace", "debug", "info", "warn", "error"]
    level: info
    #@schema/desc "The log format: `text`, or `json` for structured logs."
    #@schema/validation one_of=["text", "json"]
    format: text
  #@schema/desc "Settings for the Prometheus metrics."
  metrics:
    #@schema/desc "Whether the API Server and PostgreSQL expose Prometheus metrics, and their Pods are annotated for scraping."
    enabled: true

#! =============================================
#! Proxy
#! =============================================

#@schema/desc "Settings for the corporate proxy used by the API Server when calling external services."
proxy:
  #@schema/desc "The proxy for the network traffic, in the form `http://[user[:password]@]host[:port]`. Used only when `https_proxy` is not set."
  #@schema/validation ("a URL like `http://[user[:password]@]host[:port]`", lambda v: v == "" or is_proxy_url(v))
  http_proxy: ""
  #@schema/desc "The proxy for the network traffic, in the form `http://[user[:password]@]host[:port]`."
  #@schema/validation ("a URL like `http://[user[:password]@]host[:port]`", lambda v: v == "" or is_proxy_url(v))
  https_proxy: ""
  #@schema/desc "A comma-separated list of hostnames or IP addresses, optionally with a port, that should not use the proxy. An entry matches the host exactly or any of its subdomains. CIDR ranges and leading-dot notation are not supported."
  #@schema/examples ("Skip the proxy for internal services", "localhost,kadras.io")
  no_proxy: ""
