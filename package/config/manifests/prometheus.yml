#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("config.star", "management_port")

#@ if data.values.api_server.metrics.enabled:
#@overlay/match by=overlay.subset({"kind":"Deployment","metadata":{"name":"dependency-track-api-server"}})
---
spec:
  template:
    #@overlay/match-child-defaults missing_ok=True
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: #@ str(management_port)
#@ end

#@ if data.values.postgresql.metrics.enabled:
#@overlay/match by=overlay.subset({"kind":"Cluster","metadata":{"name":"postgresql-dependency-track"}})
---
#@overlay/match-child-defaults missing_ok=True
spec:
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: "/metrics"
      prometheus.io/port: "metrics"
#@ end
