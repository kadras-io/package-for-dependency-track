---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dependency-track-app-config
  namespace: dependency-track
  annotations:
    kapp.k14s.io/versioned: ""
data:
  #! Dependency Track loads additional properties from `${cwd}/config/application.properties`,
  #! where `${cwd}` is the working directory of the official container image. Values defined
  #! here can be overridden at runtime via environment variables, which take precedence.
  #! https://dependencytrack.github.io/docs/next/reference/configuration/application
  application.properties: #@ application_properties()
