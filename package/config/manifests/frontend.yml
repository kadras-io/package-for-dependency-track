#@ load("@ytt:data", "data")
#@ load("@ytt:struct", "struct")
#@ load("config.star", "frontend_image_repository", "image_reference")

#! The Frontend is a static single-page application, entirely configured via environment
#! variables that it renders into `/static/config.json` at startup.
#@ def environment():
#@   config = struct.decode(data.values.frontend.config)
#@   variables = []
#@   for name in sorted(config.keys()):
#@     value = config[name]
#@     if type(value) == "bool":
#@       value = str(value).lower()
#@     end
#@     variables.append({"name": name, "value": str(value)})
#@   end
#@   return variables
#@ end

#@ def labels():
app.kubernetes.io/part-of: dependency-track
app.kubernetes.io/instance: dependency-track
app.kubernetes.io/name: dependency-track-frontend
app.kubernetes.io/component: frontend
#@ end

---
apiVersion: v1
kind: Service
metadata:
  name: dependency-track-frontend
  namespace: dependency-track
  labels: #@ labels()
spec:
  type: "ClusterIP"
  ports:
  - name: web
    port: 8080
    targetPort: web
  selector: #@ labels()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-frontend
  namespace: dependency-track
  labels: #@ labels()
spec:
  replicas: #@ data.values.frontend.replicas
  selector:
    matchLabels: #@ labels()
  template:
    metadata:
      labels: #@ labels()
    spec:
      serviceAccount: dependency-track
      containers:
      - name: dependency-track-frontend
        image: #@ image_reference(frontend_image_repository, data.values.image.tag)
        imagePullPolicy: IfNotPresent
        securityContext: 
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources: #@ data.values.frontend.resources
        #! `API_BASE_URL` is intentionally left unset by default. The Ingress serves both the
        #! Frontend and the API Server from the same host, so the Frontend can call the API
        #! via relative URLs.
        #@ if/end environment():
        env: #@ environment()
        ports:
        - name: web
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            scheme: HTTP
            port: web
            path: /static/config.json
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            scheme: HTTP
            port: web
            path: /static/config.json
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
      volumes:
      - name: tmp
        emptyDir: { }
