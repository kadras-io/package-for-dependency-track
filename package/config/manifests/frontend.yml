#@ load("@ytt:data", "data")
#@ load("/lib/dependency_track.star",
#@      "container_security_context",
#@      "format_map",
#@      "frontend_image_repository",
#@      "frontend_name",
#@      "image_reference",
#@      "labels",
#@      "pod_security_context",
#@      "web_port")

#! The Frontend is a static single-page application, entirely configured via environment
#! variables that it renders into `/static/config.json` at startup.
#@ def environment():
#@   return [{"name": name, "value": value} for name, value in format_map(data.values.frontend.config).items()]
#@ end

---
apiVersion: v1
kind: Service
metadata:
  name: #@ frontend_name
  namespace: #@ data.values.namespace
  labels: #@ labels("frontend")
spec:
  type: "ClusterIP"
  ports:
  - name: web
    port: #@ web_port
    targetPort: web
  selector: #@ labels("frontend")

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #@ frontend_name
  namespace: #@ data.values.namespace
  labels: #@ labels("frontend")
spec:
  replicas: #@ data.values.frontend.replicas
  selector:
    matchLabels: #@ labels("frontend")
  template:
    metadata:
      labels: #@ labels("frontend")
    spec:
      serviceAccountName: dependency-track
      securityContext: #@ pod_security_context()
      containers:
      - name: #@ frontend_name
        image: #@ image_reference(frontend_image_repository)
        imagePullPolicy: IfNotPresent
        #! The container writes `static/config.json` into the web root at startup, so the root filesystem can't be read-only.
        securityContext: #@ container_security_context(read_only_root_filesystem=False)
        resources: #@ data.values.frontend.resources
        #! `API_BASE_URL` is intentionally left unset by default. The HTTPRoute serves both the
        #! Frontend and the API Server from the same host, so the Frontend can call the API
        #! via relative URLs.
        #@ if/end environment():
        env: #@ environment()
        ports:
        - name: web
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            scheme: HTTP
            port: web
            path: /static/config.json
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            scheme: HTTP
            port: web
            path: /static/config.json
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
      volumes:
      - name: tmp
        emptyDir: { }
