#@ load("@ytt:data", "data")
#@ load("/lib/dependency_track.star", "kek_secret_name", "kek_secret_key")

#! Dependency Track stores the secrets it manages (such as integration credentials)
#! encrypted in PostgreSQL. The encryption relies on a key encryption key (KEK), which
#! must be provided as a base64-encoded, 32-byte AES key.
#! https://dependencytrack.github.io/docs/next/guides/administration/configuring-secret-management

---
#! Generates 32 random characters, used as the raw key material for the KEK.
apiVersion: secretgen.k14s.io/v1alpha1
kind: Password
metadata:
  name: dependency-track-kek-material
  namespace: #@ data.values.namespace
spec:
  length: 32
  secretTemplate:
    #! secretgen-controller copies the labels of the Password to the Secret it generates, including the
    #! one kapp uses to track the resources of the app. The Secret is kept when uninstalling the package,
    #! like the Password owning it (see `overlays/uninstall.yml`), so it must not be tracked by kapp:
    #! kapp would wait for it to be deleted. Losing it would generate a new KEK on the next installation,
    #! making the secrets stored in the database unreadable.
    metadata:
      labels:
        kapp.k14s.io/app: ""
    type: Opaque
    stringData:
      password: $(value)

---
#! References to the `data` field of a Secret resolve to the base64 representation of
#! the value. Assigning such a reference to `stringData` stores that base64 text verbatim,
#! which is exactly the encoding Dependency Track expects for the KEK.
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretTemplate
metadata:
  name: #@ kek_secret_name
  namespace: #@ data.values.namespace
spec:
  inputResources:
  - name: material
    ref:
      apiVersion: v1
      kind: Secret
      name: dependency-track-kek-material
  template:
    type: Opaque
    stringData: #@ {kek_secret_key: "$(.material.data.password)"}
