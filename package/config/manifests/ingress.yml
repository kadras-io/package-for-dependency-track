#@ load("@ytt:data", "data")
#@ load("/lib/dependency_track.star", "api_server_name", "frontend_name", "labels")

#@ if data.values.ingress.enabled:
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dependency-track
  namespace: #@ data.values.namespace
  labels: #@ labels("ingress")
  #@ if/end data.values.ingress.issuer != "":
  annotations:
    cert-manager.io/cluster-issuer: #@ data.values.ingress.issuer
spec:
  ingressClassName: #@ data.values.ingress.class_name
  rules:
  - host: #@ data.values.domain_name
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: #@ api_server_name
            port:
              name: web
      - path: /
        pathType: Prefix
        backend:
          service:
            name: #@ frontend_name
            port:
              name: web
  tls:
  - hosts:
    - #@ data.values.domain_name
    secretName: #@ data.values.ingress.tls_secret_name
#@ end
