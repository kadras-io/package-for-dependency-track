#@ load("@ytt:data", "data")
#@ load("/lib/dependency_track.star",
#@      "api_server_image_repository",
#@      "api_server_name",
#@      "config_directory",
#@      "container_security_context",
#@      "data_directory",
#@      "image_reference",
#@      "kek_secret_directory",
#@      "kek_secret_key",
#@      "kek_secret_name",
#@      "labels",
#@      "management_port",
#@      "pod_security_context",
#@      "postgresql_secret_directory",
#@      "postgresql_secret_name",
#@      "storage_claim_name",
#@      "web_port")

#! The official container image bundles a Logback configuration producing JSON logs,
#! which is enabled via a JVM system property.
#@ def extra_java_options():
#@   if data.values.observability.logging.format == "json":
#@     return "-Dlogback.configurationFile=logback-json.xml"
#@   end
#@   return ""
#@ end

#@ data_directory_volume = "data"

---
apiVersion: v1
kind: Service
metadata:
  name: #@ api_server_name
  namespace: #@ data.values.namespace
  labels: #@ labels("api-server")
spec:
  type: "ClusterIP"
  ports:
  - name: web
    port: #@ web_port
    targetPort: web
  selector: #@ labels("api-server")

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: #@ storage_claim_name
  namespace: #@ data.values.namespace
  labels: #@ labels("api-server")
spec:
  accessModes: #@ data.values.api_server.storage.access_modes
  #@ if/end data.values.api_server.storage.class_name != "":
  storageClassName: #@ data.values.api_server.storage.class_name
  resources:
    requests:
      storage: #@ data.values.api_server.storage.size

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #@ api_server_name
  namespace: #@ data.values.namespace
  labels: #@ labels("api-server")
  annotations:
    kapp.k14s.io/change-group: dependency-track
    kapp.k14s.io/change-rule.upsert: upsert after upserting postgresql
    kapp.k14s.io/change-rule.delete: delete before deleting postgresql
spec:
  replicas: #@ data.values.api_server.replicas
  #! A new Pod is only created after the previous one has been terminated, so that a
  #! ReadWriteOnce PersistentVolume can be handed over between rollouts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: #@ labels("api-server")
  template:
    metadata:
      labels: #@ labels("api-server")
    spec:
      serviceAccountName: dependency-track
      #! The container runs as UID 1000, which needs write access to the data directory.
      securityContext: #@ pod_security_context(fs_group=1000)
      #! Enough time for in-flight BOM uploads and background tasks to complete.
      terminationGracePeriodSeconds: 120
      containers:
      - name: #@ api_server_name
        image: #@ image_reference(api_server_image_repository)
        imagePullPolicy: IfNotPresent
        securityContext: #@ container_security_context()
        resources: #@ data.values.api_server.resources
        env:
        - name: EXTRA_JAVA_OPTIONS
          value: #@ extra_java_options()
        ports:
        - name: web
          containerPort: 8080
          protocol: TCP
        - name: management
          containerPort: #@ management_port
          protocol: TCP
        volumeMounts:
        - name: #@ data_directory_volume
          mountPath: #@ data_directory
        - name: tmp
          mountPath: /tmp
        - name: app-config
          mountPath: #@ config_directory
          readOnly: true
        - name: postgresql-credentials
          mountPath: #@ postgresql_secret_directory
          readOnly: true
        - name: encryption-key
          mountPath: #@ kek_secret_directory
          readOnly: true
        #! The startup probe budget covers the database migrations and the seeding of
        #! default objects, which run when the API Server starts for the first time
        #! after an installation or an upgrade.
        startupProbe:
          httpGet:
            scheme: HTTP
            port: management
            path: /health/started
          failureThreshold: 60
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            scheme: HTTP
            port: management
            path: /health/live
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            scheme: HTTP
            port: management
            path: /health/ready
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
      volumes:
      - name: #@ data_directory_volume
        persistentVolumeClaim:
          claimName: #@ storage_claim_name
      - name: tmp
        emptyDir: { }
      - name: app-config
        configMap:
          name: dependency-track-app-config
      - name: postgresql-credentials
        secret:
          secretName: #@ postgresql_secret_name
          defaultMode: 0444
          items:
          - key: username
            path: username
          - key: password
            path: password
      - name: encryption-key
        secret:
          secretName: #@ kek_secret_name
          defaultMode: 0444
          items:
          - key: #@ kek_secret_key
            path: #@ kek_secret_key
