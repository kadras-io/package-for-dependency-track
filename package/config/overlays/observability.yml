#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/dependency_track.star", "api_server_name", "management_port", "postgresql_cluster_name")

#! The API Server exposes Prometheus metrics on the management port, and each PostgreSQL instance
#! on the port of the CloudNativePG exporter. The Pods are annotated for annotation-based scraping.
#! CloudNativePG propagates the annotations in `inheritedMetadata` to all the objects it creates,
#! the Pods included. The logs are configured in `manifests/app-config.yml`.
#! See: https://dependencytrack.github.io/docs/next/reference/configuration/properties/
#! and https://cloudnative-pg.io/docs/devel/monitoring/

#@ cnpg_metrics_port = 9187

#@ if data.values.observability.metrics.enabled:
#@overlay/match by=overlay.subset({"kind":"Deployment", "metadata":{"name":api_server_name}})
---
spec:
  template:
    metadata:
      #@overlay/match missing_ok=True
      annotations:
        #@overlay/match missing_ok=True
        prometheus.io/scrape: "true"
        #@overlay/match missing_ok=True
        prometheus.io/path: "/metrics"
        #@overlay/match missing_ok=True
        prometheus.io/port: #@ str(management_port)

#@overlay/match by=overlay.subset({"kind":"Cluster", "metadata":{"name":postgresql_cluster_name}})
---
spec:
  #@overlay/match missing_ok=True
  inheritedMetadata:
    #@overlay/match missing_ok=True
    annotations:
      #@overlay/match missing_ok=True
      prometheus.io/scrape: "true"
      #@overlay/match missing_ok=True
      prometheus.io/path: "/metrics"
      #@overlay/match missing_ok=True
      prometheus.io/port: #@ str(cnpg_metrics_port)
#@ end
