#@ load("@ytt:data", "data")
#@ load("/lib/dependency_track.star", "labels")

#! A PodDisruptionBudget is only meaningful when more than one replica is running.
#! With a single replica, it would block voluntary disruptions such as node drains.
#! See: https://kubernetes.io/docs/tasks/run-application/configure-pdb/

#@ components = {"api-server": data.values.api_server.replicas, "frontend": data.values.frontend.replicas}

#@ for component, replicas in components.items():
#@ if replicas > 1:
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: #@ "dependency-track-" + component
  namespace: #@ data.values.namespace
  labels: #@ labels(component)
spec:
  minAvailable: 1
  selector:
    matchLabels: #@ labels(component)
#@ end
#@ end
